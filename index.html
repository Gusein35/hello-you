<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special for Mrs. Şirin</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#1f1c2c,#928dab);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
  color:white;
}

.top-text{
  position:absolute;
  top:-60px;
  width:100%;
  text-align:center;
  font-size:22px;
  font-weight:600;
  animation:slideDown 2s ease forwards;
}

@keyframes slideDown{
  to{
    top:30px;
  }
}

.card{
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(12px);
  width:90%;
  max-width:420px;
  border-radius:20px;
  padding:30px 20px;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.35);
  opacity:0;
  animation:fadeIn 1.5s ease forwards;
  animation-delay:1s;
}

@keyframes fadeIn{
  to{
    opacity:1;
  }
}

img{
  width:200px;
  border-radius:15px;
  margin-bottom:20px;
}

.typewriter{
  font-size:17px;
  line-height:1.6;
  white-space:pre-line;
  border-right:2px solid white;
  display:inline-block;
  min-height:60px;
}

.buttons{
  margin-top:25px;
  position:relative;
  height:120px;
}

button{
  padding:10px 22px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-size:15px;
  transition:.2s;
}

#yesBtn{
  background:white;
  color:#222;
}

#yesBtn:hover{
  background:#ececec;
}

#noBtn{
  position:absolute;
  left:60%;
  top:20px;
  background:#ff4d6d;
  color:white;
}
</style>
</head>

<body>

<div class="top-text">
🎭 Special for Mrs. Şirin
</div>

<div class="card">

<img src="./CD1A7B7A-ED4A-4A27-938E-5D94091C878E.png" alt="Şirin">

<div id="text" class="typewriter"></div>

<div class="buttons" id="btnArea">

<button id="yesBtn">
Bəli 
</button>

<button id="noBtn" type="button">
Yox 
</button>

</div>

</div>

<script>

const message =
`Mrs. lacase de Şirin,
Takibi qəbul edərsiniz? `;

let i = 0;
const speed = 45;
const text = document.getElementById("text");

function typeWriter(){
    if(i < message.length){
        text.textContent += message.charAt(i);
        i++;
        setTimeout(typeWriter,speed);
    }
}

setTimeout(typeWriter,1800);

document.getElementById("yesBtn").onclick = () => {
    alert("Təşəkkür edirəm!\nTarixin ən böyük heisti üçün xəbəri gözləyin... 🎭");
};

const noBtn = document.getElementById("noBtn");
const area = document.getElementById("btnArea");

function moveNoBtn(){

    const areaRect = area.getBoundingClientRect();
    const btnRect = noBtn.getBoundingClientRect();

    const maxX = areaRect.width - btnRect.width;
    const maxY = areaRect.height - btnRect.height;

    noBtn.style.left = Math.random()*maxX + "px";
    noBtn.style.top = Math.random()*maxY + "px";
}

noBtn.addEventListener("mouseover",moveNoBtn);

noBtn.addEventListener("click",(e)=>{
    e.preventDefault();
    moveNoBtn();
});

noBtn.addEventListener("touchstart",(e)=>{
    e.preventDefault();
    moveNoBtn();
},{passive:false});

setTimeout(moveNoBtn,500);

</script>

</body>
</html>
