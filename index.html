<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuray üçün </title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#1f1c2c,#928dab);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
  color:white;
}

/* floating hearts /
.heart{
  position:absolute;
  color:red;
  animation:float 6s linear infinite;
}
@keyframes float{
  from{transform:translateY(100vh); opacity:1;}
  to{transform:translateY(-10vh); opacity:0;}
}

.top-text{
  position:absolute;
  top:-60px;
  width:100%;
  text-align:center;
  font-size:22px;
  font-weight:600;
  animation:slideDown 2s ease forwards;
}
@keyframes slideDown{ to{ top:30px; } }

.card{
  position:relative;
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(12px);
  width:90%;
  max-width:420px;
  border-radius:20px;
  padding:30px 20px;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,0.3);
  opacity:0;
  animation:fadeIn 2s ease forwards;
  animation-delay:1.5s;
}
@keyframes fadeIn{ to{ opacity:1; } }

img{
  width:200px;
  border-radius:15px;
  margin-bottom:15px;
}

.typewriter{
  font-size:16px;
  line-height:1.6;
  border-right:2px solid white;
  white-space:pre-line;
}

.buttons{
  margin-top:15px;
  position:relative;
  min-height:60px;
}

button{
  margin:5px;
  padding:10px 20px;
  border:none;
  border-radius:12px;
  background:white;
  color:#333;
  cursor:pointer;
  font-size:14px;
}

#noBtn{
  position:absolute;
  left:55%;
  top:10px;
}

/ YES animation */
.big-heart{
  position:fixed;
  font-size:80px;
  animation:pop 1s ease forwards;
}
@keyframes pop{
  0%{transform:scale(0);}
  100%{transform:scale(1.5); opacity:0;}
}
</style>
</head>

<body>

<audio id="music" src="Orkhan Zeynalli ft. Ayni Khalid İllər Sonra (Rəsmi Musiqi Videosu).mp3" loop></audio>

<div class="top-text">Special for Nuray </div>

<div class="card">
  <img src="IMG_9049.jpeg" alt="Nuray">

  <div id="text" class="typewriter"></div>

  <div class="buttons" id="btnArea">
    <button onclick="accept()">Hə <3</button>
    <button id="noBtn" type="button">Yox</button>
  </div>
</div>

<script>
// typewriter
const message = Salam Nuray xanım,  Sabah mənimlə date edərsinizmi? 💖;

let i = 0;
function typeWriter(){
  if(i < message.length){
    document.getElementById("text").innerHTML += message.charAt(i);
    i++;
    setTimeout(typeWriter, 40);
  }
}
setTimeout(typeWriter, 2000);

// hearts background
function createHeart(){
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤️";
  heart.style.left = Math.random()*100 + "vw";
  heart.style.fontSize = (Math.random()*20+10) + "px";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),6000);
}
setInterval(createHeart, 300);

// NO button escape
const noBtn = document.getElementById("noBtn");
const area = document.getElementById("btnArea");

function moveNoBtn(){
  const maxX = area.offsetWidth - noBtn.offsetWidth;
  const maxY = area.offsetHeight - noBtn.offsetHeight;
  noBtn.style.left = Math.random()*maxX + "px";
  noBtn.style.top = Math.random()*maxY + "px";
}

noBtn.addEventListener("mouseover", moveNoBtn);
noBtn.addEventListener("touchstart", (e)=>{
  e.preventDefault();
  moveNoBtn();
});

// YES click
function accept(){
  document.getElementById("music").play();

  for(let i=0;i<10;i++){
    const h = document.createElement("div");
    h.className="big-heart";
    h.innerHTML="<3";
    h.style.left = Math.random()*100+"vw";
    h.style.top = Math.random()*100+"vh";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),1000);
  }

  alert("Super! Sabah görüşürük :)");
}
</script>

</body>
</html>
