<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#1f1c2c,#928dab);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
  color:white;
}

.top-text{
  position:absolute;
  top:-60px;
  width:100%;
  text-align:center;
  font-size:22px;
  font-weight:600;
  animation:slideDown 2s ease forwards;
}

@keyframes slideDown{
  to{ top:30px; }
}

.card{
  position:relative;
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(12px);
  width:90%;
  max-width:420px;
  border-radius:20px;
  padding:30px 20px;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,0.3);
  opacity:0;
  animation:fadeIn 2s ease forwards;
  animation-delay:1.5s;
  overflow:hidden;
}

@keyframes fadeIn{
  to{ opacity:1; }
}

img{
  width:200px;
  border-radius:15px;
  margin-bottom:15px;
}

.typewriter{
  font-size:16px;
  line-height:1.6;
  border-right:2px solid white;
  white-space:pre-line;
}

.buttons{
  margin-top:15px;
  position:relative;
  min-height:60px;
}

button{
  margin:5px;
  padding:10px 20px;
  border:none;
  border-radius:12px;
  background:white;
  color:#333;
  cursor:pointer;
  font-size:14px;
}

button:hover{
  background:#ddd;
}

#noBtn{
  position:absolute;
  left:55%;
  top:10px;
}
</style>
</head>

<body>

<div class="top-text">Special for mrs. Narmin</div>

<div class="card">
  <img src="IMG_9667.jpeg" alt="Narmin">

  <div id="text" class="typewriter"></div>

  <div class="buttons" id="btnArea">
    <button id="yesBtn"
      onclick="alert('Sənlə evlənməyəcəm bəs kiminlə evlənəcəm axı ')">
      Hə
    </button>

    <button id="noBtn" type="button">Yox</button>
  </div>
</div>

<script>
const message =
`Salam, Nərmin xanım, mənimlə gələcəkdə evlənərsinizmi ? 
Yox desəniz də inciməyəcəm `;

let i = 0;
const speed = 45;
const textElement = document.getElementById("text");

function typeWriter() {
  if (i < message.length) {
    textElement.innerHTML += message.charAt(i);
    i++;
    setTimeout(typeWriter, speed);
  }
}

setTimeout(typeWriter, 2000);

// Qaçan "Yox" buttonu
const noBtn = document.getElementById("noBtn");
const area = document.getElementById("btnArea");

function moveNoBtn() {

  const areaRect = area.getBoundingClientRect();
  const btnRect = noBtn.getBoundingClientRect();

  const maxX = areaRect.width - btnRect.width - 5;
  const maxY = areaRect.height - btnRect.height - 5;

  const x = Math.random() * Math.max(0, maxX);
  const y = Math.random() * Math.max(0, maxY);

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

// Telefon üçün
noBtn.addEventListener("touchstart", (e) => {
  e.preventDefault();
  moveNoBtn();
}, { passive:false });

// PC üçün
noBtn.addEventListener("mouseover", moveNoBtn);

noBtn.addEventListener("click", (e) => {
  e.preventDefault();
  moveNoBtn();
});

// İlk random yer
setTimeout(moveNoBtn, 500);
</script>

</body>
</html>
