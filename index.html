<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salam Şirin Qız </title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#1f1c2c,#928dab);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    color:#fff;
}

.top-text{
    position:absolute;
    top:-60px;
    width:100%;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    animation:slideDown 2s forwards;
}

@keyframes slideDown{
    to{top:30px;}
}

.card{
    width:90%;
    max-width:420px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(12px);
    border-radius:20px;
    padding:25px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
    animation:fadeIn 1.5s forwards;
    opacity:0;
}

@keyframes fadeIn{
    to{opacity:1;}
}

img{
    width:200px;
    border-radius:15px;
    margin-bottom:20px;
}

.typewriter{
    font-size:18px;
    line-height:1.6;
    white-space:pre-line;
    min-height:70px;
    border-right:2px solid #fff;
    display:inline-block;
}

.buttons{
    position:relative;
    margin-top:25px;
    height:120px;
}

button{
    padding:10px 22px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:15px;
}

#yesBtn{
    background:#fff;
    color:#222;
}

#noBtn{
    position:absolute;
    left:60%;
    top:20px;
    background:#ff4d6d;
    color:white;
}
</style>
</head>

<body>

<div class="top-text">
Salam Şirin Xanım
</div>

<div class="card">

<img src="158D67B1-CE08-4220-8925-0AD1D3453AE7.png" alt="Şirin">

<div id="text" class="typewriter"></div>

<div class="buttons" id="btnArea">
    <button id="yesBtn">Hə </button>
    <button id="noBtn">Yox !!</button>
</div>

</div>

<script>

const message =
`Salam Şirin Xanım,

Sizi daha yaxından tanımaq olarmı?`;

let i = 0;
const speed = 45;
const text = document.getElementById("text");

function typeWriter(){
    if(i < message.length){
        text.textContent += message.charAt(i);
        i++;
        setTimeout(typeWriter,speed);
    }
}

setTimeout(typeWriter,1500);

// Hə düyməsi
document.getElementById("yesBtn").onclick = function(){
    alert(" Əla \nOnda sabah görüşərik istəsəniz");
};

// Qaçan Yox düyməsi
const noBtn = document.getElementById("noBtn");
const area = document.getElementById("btnArea");

function moveNoBtn(){

    const areaRect = area.getBoundingClientRect();
    const btnRect = noBtn.getBoundingClientRect();

    const maxX = areaRect.width - btnRect.width;
    const maxY = areaRect.height - btnRect.height;

    noBtn.style.left = Math.random()*maxX + "px";
    noBtn.style.top = Math.random()*maxY + "px";
}

noBtn.addEventListener("mouseover",moveNoBtn);

noBtn.addEventListener("click",(e)=>{
    e.preventDefault();
    moveNoBtn();
});

noBtn.addEventListener("touchstart",(e)=>{
    e.preventDefault();
    moveNoBtn();
},{passive:false});

setTimeout(moveNoBtn,500);

</script>

</body>
</html>
